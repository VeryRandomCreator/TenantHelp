name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java SDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    # 1. Build PROD APK (Outputs an unsigned APK)
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 2. Securely sign the APK
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
        buildToolsVersion: 34.0.0 # Add this line to use modern build tools

    # 3. Print the Signature Hash of the now-signed APK
    - name: Print App Signature Hash
      run: |
        echo "------------------------------------------------------------"
        echo "Extracting signing certificate SHA-256..."
        # The signing step outputs the exact path of the signed file
        keytool -printcert -jarfile "${{ steps.sign_app.outputs.signedReleaseFile }}" | grep "SHA256:" | sed 's/^[[:space:]]*//'
        echo "------------------------------------------------------------"

    # 4. Upload Signed Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rent-help-apk-release
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}

    # 5. Stage the Release
    - name: Stage Draft Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        name: Staged Release ${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        draft: true 
        generate_release_notes: true
