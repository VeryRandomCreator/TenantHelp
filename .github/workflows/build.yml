name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java SDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    # 1. Build PROD APK (Outputs an unsigned APK)
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # 2. Securely sign the APK
    - name: Sign APK
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PW: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Find the unsigned APK generated by Gradle
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        
        # Find the latest Android build tools directory dynamically
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        
        # Decode the Base64 keystore into a temporary file
        echo "$KEYSTORE_B64" | base64 --decode > my-release-key.jks
        
        # 1. Zipalign (Optimizes the APK)
        $BUILD_TOOLS/zipalign -v -p 4 "$APK_PATH" app-release-aligned.apk
        
        # 2. Sign the APK
        $BUILD_TOOLS/apksigner sign --ks my-release-key.jks \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass pass:"$KEYSTORE_PW" \
          --key-pass pass:"$KEY_PW" \
          --out app-release-signed.apk \
          app-release-aligned.apk
          
        # Securely delete the keystore file from the runner
        rm my-release-key.jks

    # 3. Print the Signature Hash of the now-signed APK
    - name: Print App Signature Hash
      run: |
        echo "------------------------------------------------------------"
        echo "Extracting signing certificate SHA-256..."
        # The signing step outputs the exact path of the signed file
        keytool -printcert -jarfile "${{ steps.sign_app.outputs.signedReleaseFile }}" | grep "SHA256:" | sed 's/^[[:space:]]*//'
        echo "------------------------------------------------------------"

    # 4. Upload Signed Artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rent-help-apk-release
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}

    # 5. Stage the Release
    - name: Stage Draft Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        name: Staged Release ${{ github.run_number }}
        tag_name: build-${{ github.run_number }}
        draft: true 
        generate_release_notes: true
